services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: dnxer111/taski_backend:latest
    env_file: .env
    volumes:
      - static:/app/staticfiles

  frontend:
    image: dnxer111/taski_frontend:latest

  gateway:
    image: dnxer111/taski_gateway:latest
    volumes:
      - static:/staticfiles
    ports:
      - "8000:80"

volumes:
  pg_data:
  static: